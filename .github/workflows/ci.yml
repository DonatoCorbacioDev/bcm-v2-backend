name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ita

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw verify --batch-mode -P test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/classes/META-INF/sbom/application.cdx.json
          retention-days: 90

      # OWASP Secure Code Review, dependency scanning: every library in the
      # SBOM the build just wrote, checked by Trivy on this push, not only
      # when the docker repo's image scan runs. Fails on a HIGH or CRITICAL
      # vulnerability that a newer version fixes. The official image, pinned
      # by digest (0.76.1), as in bcm-v2-docker's image-scan.yml.
      - name: Scan dependencies (Trivy on the SBOM)
        run: |
          docker run --rm -v "$PWD/target/classes/META-INF/sbom:/sbom:ro" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            sbom /sbom/application.cdx.json \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress

      - name: SonarCloud analysis
        run: |
          ./mvnw sonar:sonar --batch-mode -P test \
            -Dsonar.projectKey=DonatoCorbacioDev_bcm-v2-backend \
            -Dsonar.organization=donatocorbaciodev \
            -Dsonar.host.url=https://sonarcloud.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

