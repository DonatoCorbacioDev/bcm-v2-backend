name: CodeQL

# OWASP Secure Code Review Cheat Sheet, static analysis with data flow:
# CodeQL follows every value from where it enters (a request, a file, a
# response from another service) to where it is used (a query, a path, a
# page, a log) and reports the paths no check stops. On every push and every
# Monday, with the security-extended queries; results in the repository's
# Security tab. The job fails on a high or critical finding.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned by commit (v4.39.3): a tag can be moved.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:java-kotlin"
          output: codeql-results

      # The Security tab lists every finding; this step turns the serious
      # ones (security severity 7.0 or more: high and critical) into a red
      # build, so none goes unnoticed.
      - name: Fail on high or critical findings
        run: |
          python3 - codeql-results <<'EOF'
          import json, pathlib, sys
          # Findings reviewed and accepted, each for one file, with the reason.
          # Still listed in the Security tab; not failing the build.
          ACCEPTED = {
              # CSRF tokens are off on purpose: every request authenticates with
              # the Authorization header, which a browser never sends on its own.
              # The one cookie (refresh) is SameSite=Strict and a foreign Origin
              # is refused with 403 by CORS (AuthControllerTest
              # .cookieEndpointsRefuseAForeignOrigin). Reviewed 2026-11-18.
              ("java/spring-disabled-csrf-protection",
               "src/main/java/com/donatodev/bcm_backend/security/SecurityConfig.java"),
              # SHA-1 is Have I Been Pwned's own index: the range API takes the
              # first 5 hex characters of a password's SHA-1 (k-anonymity) and
              # nothing else. It protects nothing here; passwords are stored as
              # BCrypt hashes. Reviewed 2026-11-24.
              ("java/potentially-weak-cryptographic-algorithm",
               "src/main/java/com/donatodev/bcm_backend/security/PwnedPasswordsClient.java"),
          }
          serious = []
          for sarif in pathlib.Path(sys.argv[1]).glob("*.sarif"):
              for run in json.loads(sarif.read_text())["runs"]:
                  rules = {}
                  for component in [run["tool"]["driver"], *run["tool"].get("extensions", [])]:
                      for rule in component.get("rules", []):
                          rules[rule["id"]] = rule
                  for result in run.get("results", []):
                      rule = rules.get(result.get("ruleId"), {})
                      score = float(rule.get("properties", {}).get("security-severity", 0) or 0)
                      if score >= 7.0:
                          where = result["locations"][0]["physicalLocation"]
                          uri = where["artifactLocation"]["uri"]
                          if (result.get("ruleId"), uri) in ACCEPTED:
                              print(f'accepted: {result["ruleId"]} {uri}')
                              continue
                          serious.append(f'{score} {result["ruleId"]} '
                                         f'{uri}:{where.get("region", {}).get("startLine", "?")}')
          for line in serious:
              print(f"::error::{line}")
          print(f"{len(serious)} high or critical finding(s)")
          sys.exit(1 if serious else 0)
          EOF
